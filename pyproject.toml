[project]
name = "virtual-columns"
version = "0.1.0"
description = "Add computed virtual columns to pandas DataFrames from simple +, -, * expressions, without eval()."
readme = "README.md"
authors = [
    { name = "Hubert Stasiowski", email = "hstasiowski1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
